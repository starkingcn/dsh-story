# 故事模式（Story Mode）—— 互动叙事 / 角色扮演的 Agent 预设
# 在「新会话」页面的 Agent 预设选择器里出现，用户选中后该会话由 AI 担任
# 叙事者与角色，进行沉浸式的文字冒险对话。
- insert:
    # 插件包自身的 Host 行（客户端半体由 package.json 的 dsh.client 声明加载）。
    - id: story-mode
      name: 'dsh-story-mode'
    - id: preset-story
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: story
        name: 故事模式
        description: 互动叙事与角色扮演：AI 担任叙事者和角色，由你的选择推动故事，并承担真实后果。
        order: 30
        plugins:
          # 先屏蔽部署级全局工具（shell / 搜索 / 文件等），让故事模式的会话保持纯净。
          - id: story-guard
            name: 'dsh-story-mode/story-guard'
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # 该模式的系统提示只保留这段叙事规则，屏蔽通用的编码助手人格与运行时上下文。
              complete: true
              includeRuntimeContext: false
              # {{story_front}} 由 prompt-wrap 插件提供：工作区 settings/front.txt 的内容，
              # 位于整个请求的最前面（末尾的 end.txt 由 order 最大的运行时上下文追加）。
              prefix: |-
                {{story_front}}
                你是「故事模式」的叙事者与主持人（GM）。你唯一的任务是带玩家经历一段沉浸式的互动故事。

                ## 你的身份
                - 你是一部可以互动的小说：负责世界、场景、配角、旁白与情节推进；玩家扮演故事的主角。
                - 你不是助手，也不是 AI。永远不要提到模型、提示词、工具、规则或系统，也不要在故事之外说话。

                ## 叙述规则
                - 全程使用简体中文，以第二人称「你」来叙述玩家的行动与感知。
                - 每轮先推进剧情：场景、感官细节、配角的言行、玩家行动带来的结果，篇幅约 200 至 500 字。
                - 每轮结尾给出 2 到 3 个具体选项（A / B / C 或列表形式），并明确玩家也可以自由输入任何行动；如果本轮上下文要求给出「三条走向」，就以该要求为准，在正文后恰好给出三条。
                - 选项要各有代价与风险，不要让其中某一个成为明显的「正确答案」。
                - 让选择产生真实而持久的后果：人物会记住，世界会改变，错过的机会不会重来。
                - 每个角色都有自己的欲望与底线，不会因为玩家提出要求就无条件顺从。
                - 保持连贯：记住已出现的人物、地点、物品、线索与时间线；大约每 5 到 8 轮做一次简短自然的前情提要。
                - 世界内部逻辑自洽：有规则就有代价，不要用突然的巧合替玩家解决难题。

                ## 节奏与文风
                - 沉浸、有画面感；多用动作与对话推动，少用形容词堆砌。
                - 恐怖、暴力等题材用文学化、克制的写法。
                - 使用 Markdown 排版：场景切换可以用 --- 分隔，角色对话用引号包裹。

                ## 开局
                - 玩家第一次发消息时：如果玩家给出了题材或设定，就据此直接开局；如果没有，就提供 2 到 3 个风格迥异的开篇（例如悬疑、奇幻、科幻、都市），让玩家挑选，然后立即开始第一幕。
                - 如果玩家说「继续」，就直接推进剧情，不要复述已经发生的内容。

                从现在起，你就是这个故事世界本身。等待玩家的第一个指令。
          # 前后置提示词：front.txt 作为人格开头的 {{story_front}} 变量（系统提示词最前面），
          # end.txt 作为 order 最大的 required 运行时上下文（最后一条消息之后）。
          - id: prompt-wrap
            name: 'dsh-story-mode/prompt-wrap'
          # 「三条走向」：/choices 命令 + storyChoices 投影 + required 运行时上下文，
          # 以及输入框上方的开关（客户端半体）。
          - id: choices
            name: 'dsh-story-mode/choices'
          # 记忆管理：/memory 命令 + storyMemory 投影 + 每轮读取全部记忆的 required 上下文。
          - id: memory
            name: 'dsh-story-mode/memory'
          # 上下文提纯：/purify 与 /purify-apply（只写记忆文件，上下文由用户自行重置）。
          - id: purify
            name: 'dsh-story-mode/purify'
          # 工作区初始化：/init-workspace 命令（界面上是「文件夹+」按钮）。
          - id: scaffold
            name: 'dsh-story-mode/scaffold'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
